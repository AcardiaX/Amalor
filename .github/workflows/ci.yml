name: CI

on:
  push:
    branches:
      - dev
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-release:
    name: Build CI Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          build-scan-publish: false

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build CI Release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload CI Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Amalor-ci-release-${{ github.sha }}
          path: app/build/outputs/apk/release/Amalor_*-release.apk
          if-no-files-found: error
          retention-days: 14
          archive: false
