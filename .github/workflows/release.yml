name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version without the v prefix, for example 1.0.0"
        required: true
        type: string
      notes_only:
        description: "Only generate and validate bilingual notes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        if: ${{ !inputs.notes_only }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: ${{ !inputs.notes_only }}
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          build-scan-publish: false

      - name: Grant execute permission for Gradle
        if: ${{ !inputs.notes_only }}
        run: chmod +x ./gradlew

      - name: Prepare release signing
        if: ${{ !inputs.notes_only }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build release APK
        if: ${{ !inputs.notes_only }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease -PVERSION_NAME="${{ inputs.version_name }}" --no-daemon

      - name: Upload APK artifact
        if: ${{ !inputs.notes_only }}
        uses: actions/upload-artifact@v7
        with:
          name: Amalor-v${{ inputs.version_name }}-apk
          path: app/build/outputs/apk/release/Amalor_*-release.apk
          retention-days: 15
          archive: false

      - name: Find previous stable release
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: v${{ inputs.version_name }}
        run: |
          previous_tag="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt --jq '
            map(select(.isDraft == false and .isPrerelease == false and .tagName != env.CURRENT_TAG))
            | sort_by(.publishedAt)
            | reverse
            | .[0].tagName // ""')"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Generate Chinese-first bilingual release notes
        timeout-minutes: 5
        env:
          CURRENT_TAG: v${{ inputs.version_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIOUS_TAG: ${{ steps.release_meta.outputs.previous_tag }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          RELEASE_NOTES_API_URL: ${{ vars.RELEASE_NOTES_API_URL || 'https://api.openai.com/v1/chat/completions' }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL || 'gpt-4.1-mini' }}
        run: python3 .github/scripts/generate_release_notes.py ${{ inputs.notes_only && '--require-ai' || '' }}

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: Amalor-notes-v${{ inputs.version_name }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 15

      - name: Create GitHub Release
        if: ${{ !inputs.notes_only }}
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version_name }}
          tag_name: v${{ inputs.version_name }}
          draft: true
          prerelease: false
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/Amalor_*-release.apk
