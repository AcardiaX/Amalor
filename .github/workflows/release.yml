name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version without the v prefix, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          build-scan-publish: false

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease -PVERSION_NAME="${{ inputs.version_name }}" --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Amalor-v${{ inputs.version_name }}-apk
          path: app/build/outputs/apk/release/Amalor_*-release.apk
          retention-days: 15
          archive: false

      - name: Find previous stable release
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: v${{ inputs.version_name }}
        run: |
          previous_tag="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt --jq '
            map(select(.isDraft == false and .isPrerelease == false and .tagName != env.CURRENT_TAG))
            | sort_by(.publishedAt)
            | reverse
            | .[0].tagName // ""')"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          CURRENT_TAG: v${{ inputs.version_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIOUS_TAG: ${{ steps.release_meta.outputs.previous_tag }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS_TAG" ]; then
            LOG_RANGE=("$PREVIOUS_TAG..HEAD")
          else
            LOG_RANGE=()
          fi

          write_category() {
            local category="$1"
            local found=0

            while IFS=$'\t' read -r subject hash; do
              [ -n "$subject" ] || continue
              prefix="${subject%%:*}"
              prefix="${prefix%%(*}"
              case "$prefix" in
                feat|feature) commit_category="features" ;;
                perf|refactor) commit_category="improvements" ;;
                fix|bugfix) commit_category="fixes" ;;
                *) commit_category="changes" ;;
              esac
              if [ "$commit_category" = "$category" ]; then
                echo "- ${subject} (\`${hash}\`)"
                found=1
              fi
            done < <(git log --no-merges --format='%s%x09%h' "${LOG_RANGE[@]}")

            [ "$found" -eq 1 ] || echo "- 无 / None"
            echo
          }

          {
            echo "## ✨ 新增 / Features"
            write_category "features"
            echo "## ⚡ 优化 / Improvements"
            write_category "improvements"
            echo "## 🔄 变更 / Changes"
            write_category "changes"
            echo "## 🐛 修复 / Fixes"
            write_category "fixes"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "[完整变更 / Full changelog](https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${CURRENT_TAG})"
            else
              echo "[提交记录 / Commit history](https://github.com/${GITHUB_REPOSITORY}/commits/${CURRENT_TAG})"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version_name }}
          tag_name: v${{ inputs.version_name }}
          draft: true
          prerelease: false
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/Amalor_*-release.apk
