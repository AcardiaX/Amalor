name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version without the v prefix, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          build-scan-publish: false

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease -PVERSION_NAME="${{ inputs.version_name }}" --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Amalor-v${{ inputs.version_name }}-apk
          path: app/build/outputs/apk/release/Amalor_*-release.apk
          retention-days: 15
          archive: false

      - name: Find previous stable release
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: v${{ inputs.version_name }}
        run: |
          previous_tag="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt --jq '
            map(select(.isDraft == false and .isPrerelease == false and .tagName != env.CURRENT_TAG))
            | sort_by(.publishedAt)
            | reverse
            | .[0].tagName // ""')"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Amalor ${{ inputs.version_name }}
          tag_name: v${{ inputs.version_name }}
          draft: true
          prerelease: false
          body: |
            ## 📦 构建信息 / Build Information

            - Version: `${{ inputs.version_name }}`
            - APK: `Amalor_v${{ inputs.version_name }}_<versionCode>-release.apk`
            - Minimum Android version: Android 12 (API 31)
            - Target SDK: 36

            ## 📝 更新内容 / Changes

            The change list below is generated automatically from commits and pull requests since the previous stable release.
            下面的变更记录由 GitHub 根据上一个正式版本以来的提交和 Pull Request 自动生成。

          previous_tag: ${{ steps.release_meta.outputs.previous_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/Amalor_*-release.apk
