changelog:
  categories:
    - title: "✨ Features / 新增"
      labels:
        - "feature"
        - "enhancement"
    - title: "⚡ Improvements / 优化"
      labels:
        - "improvement"
        - "performance"
        - "refactor"
    - title: "🔄 Changes / 变更"
      labels:
        - "change"
        - "breaking-change"
    - title: "🐛 Fixes / 修复"
      labels:
        - "bug"
        - "fix"
  exclude:
    labels:
      - "skip-changelog"
